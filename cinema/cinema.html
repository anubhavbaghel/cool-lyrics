<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Lyrics - Pitch Black Cinema</title>
  <link rel="icon" type="image/png" href="../icons/icon48.png">
  <link rel="stylesheet" href="cinema.css">
</head>
<body class="cl-theme-pure">
  <div class="cl-cinema-root">
    <!-- Ambient aura background layer (toggleable) -->
    <div class="cl-aura-bg">
      <div class="cl-glow-orb cl-orb-1"></div>
      <div class="cl-glow-orb cl-orb-2"></div>
    </div>

    <!-- Top Navigation & Track Meta -->
    <header class="cl-top-bar">
      <div class="cl-brand">
        <span class="cl-badge">COOL LYRICS</span>
        <span class="cl-source" id="source-badge">Connecting to player...</span>
      </div>

      <div class="cl-actions">
        <div class="cl-theme-selector">
          <button class="cl-pill-btn active" data-theme="pure">Pitch Black</button>
          <button class="cl-pill-btn" data-theme="aurora">Aurora Glow</button>
          <button class="cl-pill-btn" data-theme="neon">Cyber Neon</button>
        </div>

        <!-- WiZ Smart Light Ambient Sync -->
        <div class="cl-wiz-wrapper">
          <button class="cl-pill-btn cl-wiz-btn" id="btn-wiz-toggle" title="Philips WiZ Smart Bulb Ambient Sync">
            <span class="cl-wiz-status-dot" id="wiz-dot"></span>
            <span>💡 WiZ Light</span>
          </button>

          <!-- WiZ Floating Popover Panel -->
          <div class="cl-wiz-popover" id="wiz-popover" style="display: none;">
            <div class="cl-wiz-header">
              <span class="cl-wiz-title">💡 WiZ Room Sync</span>
              <span class="cl-wiz-chip" id="wiz-status-badge">Checking...</span>
            </div>

            <div class="cl-wiz-row">
              <span>Enable Sync</span>
              <label class="cl-switch">
                <input type="checkbox" id="wiz-enable-toggle">
                <span class="cl-slider"></span>
              </label>
            </div>

            <div class="cl-wiz-row">
              <span>Lighting Mode</span>
              <select id="wiz-mode-select" class="cl-select">
                <option value="album">🎨 Album Art Vibrant</option>
                <option value="neon">⚡ Cyber Neon</option>
                <option value="aurora">🌌 Aurora Emerald</option>
                <option value="warm">🕯️ Cozy Warm Studio</option>
              </select>
            </div>

            <div class="cl-wiz-row">
              <span>Brightness</span>
              <input type="range" id="wiz-brightness-slider" min="10" max="100" value="85" class="cl-range">
              <span id="wiz-brightness-val" style="font-size: 11px; width: 28px; text-align: right;">85%</span>
            </div>

            <div class="cl-wiz-row">
              <span>Lyric Beat Pulse</span>
              <label class="cl-switch">
                <input type="checkbox" id="wiz-pulse-toggle" checked>
                <span class="cl-slider"></span>
              </label>
            </div>

            <div class="cl-wiz-footer">
              <button class="cl-wiz-action-btn" id="btn-wiz-test">✨ Test Flash</button>
              <button class="cl-wiz-action-btn" id="btn-wiz-scan">🔍 Scan</button>
            </div>
          </div>
        </div>

        <button class="cl-icon-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Lyrics Scroll Stage -->
    <main class="cl-stage" id="lyrics-stage">
      <div class="cl-empty-state" id="empty-state">
        <div class="cl-pulse-ring"></div>
        <p class="cl-empty-title">Waiting for music...</p>
        <p class="cl-empty-subtitle">Play a track on Spotify, YouTube Music, or YouTube to start</p>
      </div>
      <div class="cl-lines-wrapper" id="lines-wrapper"></div>
    </main>

    <!-- Bottom Player Control Dock -->
    <footer class="cl-dock">
      <div class="cl-dock-inner">
        <!-- Track metadata -->
        <div class="cl-dock-track">
          <img class="cl-dock-art" id="dock-art" src="../icons/icon128.png" alt="Artwork">
          <div class="cl-dock-info">
            <div class="cl-dock-title" id="dock-title">—</div>
            <div class="cl-dock-artist" id="dock-artist">No song playing</div>
          </div>
        </div>

        <!-- Center Controls & Scrubber -->
        <div class="cl-dock-center">
          <div class="cl-transport-controls">
            <button class="cl-control-btn" id="btn-prev" title="Previous">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="cl-control-btn cl-play-main" id="btn-play" title="Play/Pause">
              <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="cl-control-btn" id="btn-next" title="Next">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>

          <div class="cl-progress-row">
            <span class="cl-time" id="time-current">00:00</span>
            <div class="cl-scrubber-track" id="scrubber">
              <div class="cl-scrubber-fill" id="scrubber-fill"></div>
            </div>
            <span class="cl-time" id="time-total">00:00</span>
          </div>
        </div>

        <!-- Sync Offset Fine-tuning -->
        <div class="cl-dock-tools">
          <div class="cl-sync-badge">
            <span>SYNC</span>
            <button class="cl-sync-step" id="sync-minus" title="Lyrics earlier by 0.5s">-0.5s</button>
            <span class="cl-sync-val" id="sync-val">0.0s</span>
            <button class="cl-sync-step" id="sync-plus" title="Lyrics later by 0.5s">+0.5s</button>
            <button class="cl-sync-step" id="sync-reset" title="Reset sync offset">↺</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="../utils/title-cleaner.js"></script>
  <script src="../utils/lrc-parser.js"></script>
  <script src="../utils/lyrics-api.js"></script>
  <script src="../utils/color-extractor.js"></script>
  <script src="../utils/wiz-client.js"></script>
  <script src="cinema.js"></script>
</body>
</html>
